<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="./css/style.css">


</head>
<body>
    <div class="text-center pt-1 bg-warning">
        <p class="Font display-4">SCRIPT JAVASCRIPT</p>
        <p class="Font">Una collezione di script Javascript</p>
    </div>

    
        <div class="row m-5">
            <div class="col-3 p-4 border border-warning text-center">
                <h1 class="fs-2 text-primary">COSA FA LO SCRIPT</h1>
                <img src="./images/logo-Javascript.png" alt="" class="w-75 ">
                <p class="bg-primary text-light">Inserisci un numero e lo script calcolerà i divisori</p>
            </div>

            <div class="col-5 p-4 border border-warning text-center">
                <h1 class="fs-2 text-primary">IL TUO INPUT</h1>
                <form action="" class="w-100">
                    <input type="number" name="" id="input" placeholder="inserire numero">
                    <button type="button" class="btn btn-outline-secondary" onclick="divisori()">Calcola</button>
                </form>
            </div>

            <div class="col-4 p-4 border border-warning text-center">
                <h1 class="fs-2 text-primary pb-4">IL RISULTATO</h1>
                <div class="spinner-border text-danger" role="status" id="spinner">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p id="risultato"></p>
            </div>
        </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
</body>
</html>
